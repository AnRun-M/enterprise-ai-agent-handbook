site_name: Enterprise AI Agent Handbook
site_description: 从手写 Agent Loop 到企业级 Agent Runtime
site_author: AnRun-M
docs_dir: docs

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite

nav:
  - 首页: index.md
  - Introduction:
      - 概览: 00-introduction/index.md
      - 内容地图: 00-introduction/content-map.md
  - Agent Foundations:
      - 概览: 01-agent-foundations/index.md
      - 第 0 章: 01-agent-foundations/ch00-you-already-built-an-agent.md
  - Agent Runtime:
      - 概览: 02-agent-runtime/index.md
  - LangGraph Core:
      - 概览: 03-langgraph-core/index.md
      - 手写 vs LangGraph: 03-langgraph-core/manual-vs-langgraph.md
  - Text-to-SQL:
      - 概览: 04-text2sql/index.md
      - 规范流程: 04-text2sql/canonical-pipeline.md
  - Production:
      - 概览: 05-production/index.md
  - MCP and A2A:
      - 概览: 06-mcp-a2a/index.md
  - AI Coding:
      - 概览: 07-ai-coding/index.md
  - ADR:
      - Architecture First: adr/ADR-0001-architecture-first.md
      - Text-to-SQL Main Case: adr/ADR-0002-text2sql-main-case.md
      - LangGraph as Core Framework: adr/ADR-0003-langgraph-core-framework.md
      - Deterministic Constraints in Code: adr/ADR-0004-deterministic-constraints-in-code.md
      - Prompt Does Not Own All Rules: adr/ADR-0005-prompt-does-not-own-all-business-rules.md
      - Repository Memory over Chat Memory: adr/ADR-0006-repository-memory-over-chat-memory.md
